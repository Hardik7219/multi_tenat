services:
  app:
    build: 
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    env_file:
      - env
    depends_on:
      - mongodb
    restart: unless-stopped
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
